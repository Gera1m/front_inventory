<mat-card>
    <h2 class="alinear">Listado de Productos</h2>
    <mat-card-header>
        <div>
            <mat-form-field hintLabel="Busqueda producto" appearance="fill">
                <mat-label>Buscar Productos</mat-label>
                <input matInput #input (keyup)="applyFilter($event)">

            </mat-form-field>
        </div>
    </mat-card-header>

    <mat-card-header>
        <div class="right">
            <ul>
                <li>
                    <button mat-raised-button color="primary" (click)="openProductDialog()">
                        Agregar Producto
                    </button>
                </li>
            </ul>
        </div>
    </mat-card-header>

    <div mat-card-image>
        <mat-card-content>
            <table mat-table [dataSource]="dataSource">
                <!-- ID -->
                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef>No</th>
                    <td mat-cell *matCellDef="let element">
                        {{ element.id }}
                    </td>
                </ng-container>

                <!-- NAME -->
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef>Nombre</th>
                    <td mat-cell *matCellDef="let element">
                        {{ element.name }}
                    </td>
                </ng-container>

                <!-- ACCOUNT -->
                <ng-container matColumnDef="account">
                    <th mat-header-cell *matHeaderCellDef>Existencia</th>
                    <td mat-cell *matCellDef="let element">
                        {{ element.account }}
                    </td>
                </ng-container>

                <!-- PRICE -->
                <ng-container matColumnDef="price">
                    <th mat-header-cell *matHeaderCellDef>Precio</th>
                    <td mat-cell *matCellDef="let element">
                        {{ element.price }}
                    </td>
                </ng-container>

                <!-- PICTURE -->
                <ng-container matColumnDef="picture">
                    <th mat-header-cell *matHeaderCellDef>Imagen</th>
                    <td mat-cell *matCellDef="let element">
                        {{ element.picture }}
                    </td>
                </ng-container>

                <!-- CATEGORY -->
                <ng-container matColumnDef="category">
                    <th mat-header-cell *matHeaderCellDef>Categoría</th>
                    <td mat-cell *matCellDef="let element">
                        {{ element.category?.name }}
                    </td>
                </ng-container>

                <!-- ACTIONS -->
                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef>Acciones</th>
                    <td mat-cell *matCellDef="let element">
                        <button mat-icon-button color="accent" (click)="editProduct(element)">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button mat-icon-button color="accent" (click)="deleteProduct(element.id)">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </td>

                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayColumns;"></tr>
            </table>
        </mat-card-content>
    </div>
</mat-card>
