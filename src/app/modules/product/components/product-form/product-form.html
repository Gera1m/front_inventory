<h2 mat-dialog-title>Nuevo Producto</h2>

<div mat-dialog-content>

  <form [formGroup]="productForm">

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Existencia</mat-label>
      <input matInput type="number" formControlName="account">
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="name">
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Imagen</mat-label>
      <input matInput formControlName="picture">
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Precio</mat-label>
      <input matInput type="number" formControlName="price">
    </mat-form-field>

    <div formGroupName="category">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>ID Categoría</mat-label>
        <input matInput type="number" formControlName="id">
      </mat-form-field>
    </div>

  </form>

</div>

<div mat-dialog-actions align="end">

  <button mat-button (click)="close()">
    Cancelar
  </button>

  <button mat-raised-button color="primary" (click)="save()">
    Guardar
  </button>

</div>
